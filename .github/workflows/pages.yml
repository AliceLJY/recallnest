name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs on purpose: when deploy-pages ran in the
  # same job right after the upload, the artifact listing sometimes had not
  # caught up and it failed with "No artifacts named github-pages"
  # (2026-11-24 here, three times on 2026-11-25 in drug-mystery-desk).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check the page script
        run: node --check site/main.js

      - name: Collect the published files
        run: |
          mkdir _site
          cp site/index.html site/style.css site/main.js site/og.jpg _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
